<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Precios Dinámicos - Renfe IA</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { margin-top: 5px; padding: 8px; width: 100%; max-width: 300px; box-sizing: border-box; }
        button { margin-top: 25px; padding: 10px 20px; cursor: pointer; background-color: #004481; color: white; border: none; font-weight: bold; }
        button:hover { background-color: #003366; }
        #resultado { margin-top: 25px; font-weight: bold; font-size: 1.2em; white-space: pre-line; color: #333; }
    </style>
</head>
<body>
    <h1>Simulador de Precios Dinámicos (Modelo Multiruta)</h1>
    
    <form id="formulario-precios">
        <label for="origen">Origen:</label>
        <select id="origen" required>
            <option value="MADRID">Madrid</option>
            <option value="BARCELONA">Barcelona</option>
            <option value="SEVILLA">Sevilla</option>
            <option value="VALENCIA">Valencia</option>
        </select>

        <label for="destino">Destino:</label>
        <select id="destino" required>
            <option value="BARCELONA">Barcelona</option>
            <option value="MADRID">Madrid</option>
            <option value="SEVILLA">Sevilla</option>
            <option value="VALENCIA">Valencia</option>
        </select>

        <label for="dias">Días hasta la salida (0-30):</label>
        <input type="number" id="dias" min="0" max="30" required>

        <label for="asientos">Asientos libres (0-100):</label>
        <input type="number" id="asientos" min="0" max="100" required>

        <label for="precio_base">Precio base de referencia (€):</label>
        <input type="number" id="precio_base" step="0.01" required>

        <button type="button" onclick="calcularPrecio()">Calcular Precio Óptimo</button>
    </form>

    <div id="resultado"></div>

    <!-- Carga del modelo IA generado por Python -->
    <script src="cerebro.js"></script>
    <!-- Carga de la lógica de la aplicación -->
    <script src="main.js"></script>
</body>
</html>
