<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renfe RM | Dynamic Pricing & Gobernanza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- NAVBAR CLÁSICO RENFE (#702082) -->
  <nav style="background-color: #702082;" class="shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-6">
          <span class="text-white text-xl font-bold tracking-wider">RENFE RM</span>
          <div class="hidden md:flex space-x-4">
            <a href="#" class="bg-white/20 text-white px-3 py-2 rounded-md text-sm font-medium">Dashboard TFM</a>
            <a href="#" class="text-purple-200 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Documentación Técnica</a>
          </div>
        </div>
        <div class="flex items-center gap-2 text-xs bg-black/20 text-white px-3 py-1.5 rounded-full border border-white/10">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="status_cerebro" class="font-medium tracking-wide">CEREBRO_IA Online</span>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-8 space-y-6">

    <!-- ALARMA DE GOBERNANZA -->
    <div id="banner_gobernanza" class="hidden rounded-xl border-l-4 p-4 shadow-sm transition-all duration-300">
      <div class="flex items-start gap-3">
        <div id="icono_gobernanza" class="text-2xl mt-0.5">⚠️</div>
        <div class="flex-1">
          <h3 id="titulo_gobernanza" class="text-sm font-bold"></h3>
          <p id="desc_gobernanza" class="text-xs mt-1"></p>
        </div>
      </div>
    </div>

    <!-- Controles y KPIs -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Controles -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-5">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4 border-b pb-2">Parámetros</h2>
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-2">Corredor Ferroviario</label>
          <select id="selector_ruta" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-lg p-2.5 outline-none focus:border-[#702082] focus:ring-1 focus:ring-[#702082]"></select>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-semibold text-slate-600">Lead Time (Días)</label>
            <span class="text-sm font-bold text-[#702082]" id="txt_dias">15</span>
          </div>
          <input type="range" id="slider_dias" min="0" max="30" value="15" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-[#702082]">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-semibold text-slate-600">Plazas Libres</label>
            <span class="text-sm font-bold text-[#702082]" id="txt_asientos">50</span>
          </div>
          <input type="range" id="slider_asientos" min="0" max="100" value="50" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-[#702082]">
        </div>
      </div>

      <!-- KPIs -->
      <div class="lg:col-span-2 grid grid-cols-2 gap-4">
        
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center">
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Tarifa Base (Ref. Histórica)</div>
          <div class="text-3xl font-black text-slate-800 mt-1"><span id="kpi_precio_base">--</span> €</div>
        </div>

        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center">
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Techo Regulado Legal</div>
          <div class="text-3xl font-black text-slate-800 mt-1"><span id="kpi_tarifa_maxima">--</span> €</div>
        </div>

        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center">
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Acción IA</div>
          <div class="flex items-center gap-2 mt-1">
            <span id="kpi_multiplicador" class="text-3xl font-black text-slate-800">--</span>
            <span id="kpi_desc_accion" class="text-xs font-semibold px-2 py-1 rounded bg-slate-100 text-slate-600">--</span>
          </div>
        </div>

        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center border-l-4 border-l-[#702082]">
          <div class="text-[10px] font-bold uppercase tracking-wider text-[#702082]">Precio Final al Cliente</div>
          <div class="text-4xl font-black text-[#702082] mt-1"><span id="kpi_precio_final">--</span> €</div>
          <div id="kpi_variacion" class="text-xs font-medium text-slate-500 mt-1">--</div>
        </div>

      </div>
    </div>

    <!-- Gráficos Plotly: Se ha añadido overflow-hidden, flex y altura fija para evitar desbordes -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col h-[400px] overflow-hidden">
        <h3 class="text-xs font-bold uppercase text-slate-500 mb-2 shrink-0">Matriz de Decisión</h3>
        <div id="grafico_heatmap" class="w-full flex-1"></div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col h-[400px] overflow-hidden">
        <h3 class="text-xs font-bold uppercase text-slate-500 mb-2 shrink-0">Proyección Tarifa vs Límite</h3>
        <div id="grafico_curva" class="w-full flex-1"></div>
      </div>
    </div>

  </main>

  <script src="cerebro.js"></script>
  <script src="main.js"></script>
</body>
</html>
